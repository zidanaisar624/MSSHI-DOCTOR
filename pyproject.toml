[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msshi-doctor-app"
version = "1.0.0"
description = "Lightweight CLI & Desktop Diagnostics, Online GitHub Diff, and 6-Step Safe Repair App for MSSHI & Hermes Agent."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Muhammad Zidan Aisar (MuZA)" }
]
keywords = ["msshi", "hermes-agent", "diagnostics", "safe-repair", "github-diff", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
imaging = ["Pillow>=10.0"]
dev = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/zidanaisar624/MSSHI-DOCTOR"
Repository = "https://github.com/zidanaisar624/MSSHI-DOCTOR"
Upstream = "https://github.com/zidanaisar624/MSSHI-Mega-Semar-Sang-Hyang-Ismaya"

[project.scripts]
msshi-doctor = "msshi_doctor_app.cli:main"

[project.gui-scripts]
msshi-doctor-gui = "msshi_doctor_app.gui:launch_gui"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
